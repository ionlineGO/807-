<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SDGs 807 密室逃脫</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f1f5ef;--card:#fff;--tx:#1d2b22;--mut:#5d6b62;--bd:#d0dad3;--ac:#2e7d4f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111812;--card:#1c2820;--tx:#e8f0ea;--mut:#9db0a3;--bd:#33463a;--ac:#4cc17f}}
:root[data-theme="dark"]{--bg:#111812;--card:#1c2820;--tx:#e8f0ea;--mut:#9db0a3;--bd:#33463a;--ac:#4cc17f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Noto Sans TC","PingFang TC",sans-serif;line-height:1.5;-webkit-user-select:none;user-select:none}
main{max-width:480px;margin:0 auto;padding:8px}
canvas{display:block;width:100%;border-radius:12px;border:2px solid var(--bd);touch-action:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin:6px 0;font-size:.9rem}
.pad{display:flex;justify-content:space-between;align-items:center;margin:8px 0;touch-action:none}
.dp{display:grid;grid-template-columns:repeat(3,56px);gap:6px}
.pad button{height:52px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:1.3rem;touch-action:none}
#act{width:100px;height:100px;border-radius:50%;background:var(--ac);color:#fff;border:0;font-size:.95rem;font-weight:700}
#modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9;overflow:auto}
#modal .card{max-width:400px;width:100%;font-size:1rem;max-height:92vh;overflow:auto}
button.main,button.opt{border-radius:10px;font-size:1rem;cursor:pointer}
button.main{background:var(--ac);color:#fff;border:0;padding:10px 18px}button.gr{background:var(--mut)}
button.opt{display:inline-block;margin:4px;padding:10px 14px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
input,select{font-size:1.1rem;padding:8px;border-radius:10px;border:2px solid var(--bd);background:var(--bg);color:var(--tx)}
input.cd{font-size:1.8rem;text-align:center;letter-spacing:.4em;width:100%;margin:8px 0}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;color:#fff;font-size:.8rem;font-weight:700;background:var(--ac)}
.nr{display:flex;align-items:center;gap:8px;margin:6px 0}.nr select{flex:1}
.cp{text-align:center;font-size:1.3rem;letter-spacing:.2em;line-height:2;border:2px solid #c0392b;border-radius:8px;padding:6px;background:#fdecea;color:#7a1d12}
#log div{margin:2px 0;font-size:.85rem}
</style></head><body><main>
<div class="card" id="nb"></div>
<canvas id="cv" width="480" height="360"></canvas>
<div class="card" id="msg"></div>
<div class="pad"><div class="dp"><span></span><button id="u">▲</button><span></span><button id="l">◀</button><button id="d">▼</button><button id="r">▶</button></div><button id="act">🔍 調查</button></div>
<div class="card"><b>📝 線索紀錄</b><div id="log" style="margin-top:4px;color:var(--mut)">尚無線索</div></div>
</main><div id="modal"></div>
<script>
const STG=[{n:"永續能源",s:7,f:"SDG 7：確保人人都能取得可負擔、可靠、永續的能源。節電、使用再生能源是日常就能做到的行動。"},
{n:"消除飢餓",s:2,f:"SDG 2：消除飢餓，實現糧食安全、改善營養並促進永續農業。均衡飲食與減少食物浪費都很重要。"},
{n:"消除貧窮",s:1,f:"SDG 1：消除各地一切形式的貧窮。隨手捐發票，能幫助老人、身心障礙者與貧困家庭。"}];
const O=[
{x:62,y:50,e:"🌀",n:"左前方電扇開關",t:"sw",v:8,k:"fl"},
{x:430,y:50,e:"💡",n:"右前方電燈開關",t:"sw",v:2,k:"lr"},
{x:55,y:312,e:"🌀",n:"左後方電扇開關",t:"sw",v:0,k:"rl"},
{x:240,y:46,e:"🖥️",n:"前方大屏開關",t:"sw",v:7,k:"sc"},
{x:430,y:300,e:"🔌",n:"電源總控箱",t:"ctl"},
{x:430,y:150,e:"🥗",n:"營養公告",t:"nut"},
{x:200,y:322,e:"🏯",n:"發票捐贈罐",t:"jar"},
{x:330,y:322,e:"📄",n:"愛心公告",t:"d",s:"愛心公告：發票捐贈所得，將用於救助「老人」、「身心障礙者（殘）」與「貧窮家庭（窮）」。",lg:1},
{x:44,y:180,e:"📚",n:"書櫃",t:"d",s:"書中夾著紙條：「歡迎來到 807 密室！離開前須通過三關：能源、飢餓、貧窮。四個開關的數字，要到總控箱輸入。」",lg:1},
{x:160,y:46,e:"🕐",n:"時鐘",t:"d",s:"時鐘停在 8 點 07 分，似乎在暗示這間教室的名字。"},
{x:120,y:322,e:"🧰",n:"置物櫃",t:"d",s:"裡面只有一套體育服和一顆籃球。"},
{x:446,y:222,e:"🚪",n:"教室大門",t:"door"}];
const RC=[[110,120,64,34],[200,120,64,34],[290,120,64,34],[110,200,64,34],[200,200,64,34],[290,200,64,34],[320,66,60,24]];
const cv=document.getElementById("cv"),cx=cv.getContext("2d");
let p,keys={},on={},log=[],paused=true,t0=0,near=null,stage=0,tries=0;
function hit(x,y){if(x<34||x>446||y<34||y>326)return true;
for(const r of RC)if(x>r[0]-10&&x<r[0]+r[2]+10&&y>r[1]-10&&y<r[1]+r[3]+10)return true;
for(const o of O)if(o.t!="door"&&Math.hypot(x-o.x,y-o.y)<24)return true;return false}
function step(dt){const dx=(keys.r?1:0)-(keys.l?1:0),dy=(keys.d?1:0)-(keys.u?1:0);const n=Math.hypot(dx,dy)||1,v=125*dt;
let mx=dx/n,my=dy/n;if(!dx&&!dy&&p.tx!=null){const ex=p.tx-p.x,ey=p.ty-p.y,ed=Math.hypot(ex,ey);if(ed<5){p.tx=null;mx=my=0}else{mx=ex/ed;my=ey/ed}}else if(dx||dy)p.tx=null;
const ox=p.x,oy=p.y,nx=p.x+mx*v,ny=p.y+my*v;if(!hit(nx,p.y))p.x=nx;if(!hit(p.x,ny))p.y=ny;
p.m=Math.hypot(p.x-ox,p.y-oy)>.1;if(p.m){p.w+=dt*12;if(Math.abs(mx)>Math.abs(my))p.f=mx>0?3:2;else p.f=my>0?0:1}else{p.w=0;if(mx||my)p.tx=null}
let b=null,bd=50;for(const o of O){const d=Math.hypot(p.x-o.x,p.y-o.y);if(d<bd){bd=d;b=o}}
if(b!==near){near=b;document.getElementById("act").textContent=b?"🔍 "+b.n:"🔍 調查"}}
function drawStu(){const x=p.x,y=p.y,s=p.m?Math.sin(p.w):0,b=p.m?Math.abs(Math.cos(p.w))*2:0,f=p.f;
cx.fillStyle="#0003";cx.beginPath();cx.ellipse(x,y+15,11,4,0,0,7);cx.fill();
cx.fillStyle="#2b3a67";cx.fillRect(x-6,y+6,5,9+s*3);cx.fillRect(x+1,y+6,5,9-s*3);
cx.fillStyle="#3b6fd8";cx.fillRect(x-8,y-6-b,16,14);
if(f<2){cx.fillStyle="#f1c9a0";cx.fillRect(x-11,y-5-b+s*2,3,9);cx.fillRect(x+8,y-5-b-s*2,3,9)}
if(f==1){cx.fillStyle="#d94f4f";cx.fillRect(x-7,y-4-b,14,11)}
cx.fillStyle="#f1c9a0";cx.fillRect(x-7,y-17-b,14,12);
cx.fillStyle="#3a2a1a";cx.fillRect(x-8,y-19-b,16,f==1?12:5);
cx.fillStyle="#222";if(f==0){cx.fillRect(x-4,y-11-b,2,3);cx.fillRect(x+2,y-11-b,2,3)}if(f==2)cx.fillRect(x-6,y-11-b,2,3);if(f==3)cx.fillRect(x+4,y-11-b,2,3)}
function draw(){cx.fillStyle="#6b5a48";cx.fillRect(0,0,480,360);
for(let i=0;i<12;i++)for(let j=0;j<8;j++){cx.fillStyle=(i+j)%2?"#e9dcc3":"#dfd0b2";cx.fillRect(24+i*38,24+j*39,38,39)}
cx.fillStyle="#222";cx.fillRect(190,24,100,20);cx.fillStyle="#7a4a21";cx.fillRect(456,190,24,64);
cx.fillStyle="#fff";cx.font="bold 11px sans-serif";cx.textAlign="center";cx.fillText("807 教室",430,336);
for(const r of RC){cx.fillStyle="#a8743c";cx.fillRect(r[0],r[1],r[2],r[3]);cx.strokeStyle="#6b4520";cx.strokeRect(r[0],r[1],r[2],r[3])}
cx.font="26px sans-serif";cx.textBaseline="middle";
for(const o of O){if(o===near){cx.strokeStyle="#ffd700";cx.lineWidth=3;cx.beginPath();cx.arc(o.x,o.y,22,0,7);cx.stroke()}
cx.fillText(o.e,o.x,o.y+1);if(o.t=="sw"&&on[o.k]){cx.font="14px sans-serif";cx.fillText("✅",o.x+16,o.y-14);cx.font="26px sans-serif"}}
drawStu();if(p.tx!=null){cx.strokeStyle="#ffd700";cx.lineWidth=2;cx.beginPath();cx.arc(p.tx,p.ty,8+Math.sin(performance.now()/120)*2,0,7);cx.stroke()}}
function loop(){requestAnimationFrame(loop);if(!paused)step(1/60);draw()}
function ui(){document.getElementById("nb").innerHTML=`<span class="badge">通關編號</span> `+STG.map((s,i)=>`SDG${s.s} <b>${stage>i?"✅ "+s.s:"？"}</b>`).join("　");
document.getElementById("log").innerHTML=log.length?log.map(l=>"<div>• "+l+"</div>").join(""):"尚無線索"}
function say(t){document.getElementById("msg").innerHTML=t}
function addLog(t){if(!log.includes(t)){log.push(t);ui()}}
function M(h){const m=document.getElementById("modal");m.style.display="flex";m.innerHTML=`<div class="card">${h}</div>`;paused=true}
function closeM(){document.getElementById("modal").style.display="none";paused=false}
function act(){if(paused||!near)return;const o=near;
if(o.t=="d"){say(`${o.e} <b>${o.n}</b>：${o.s}`);if(o.lg)addLog(o.s)}
else if(o.t=="sw"){if(stage>0){say("開關已經設定完成。");return}on[o.k]=1;const m=`${o.n}：按下後，旁邊的小字寫著數字「${o.v}」`;say(`${o.e} ${m}`);addLog(m);ui()}
else if(o.t=="ctl"){if(stage>0)say("電力已恢復，總控箱運作正常。");else ctl()}
else if(o.t=="nut"){if(stage<1)say("🥗 公告欄一片漆黑，電力尚未恢復，看不清楚上面寫什麼。");else if(stage>1)say("🥗 你已完成營養均衡公告。");else nut()}
else if(o.t=="jar"){if(stage<2)say("🏯 罐子上了鎖，貼著字條：「先吃飽、有力氣，才能做公益」。");else if(stage>2)say("🏯 你已完成發票捐贈罐的謎題。");else jar()}
else door()}
function pass(n,extra){stage=n;ui();const s=STG[n-1];
M(`<span class="badge">SDG ${s.s} ${s.n}</span><h3>✅ 關卡通過！</h3>${extra||""}<p>${s.f}</p><p style="font-size:1.4rem;text-align:center">取得關卡編號：<b>${s.s}</b></p><button class="main" onclick="closeM()">繼續搜索</button>`);addLog(`通過 SDG ${s.s}（${s.n}）`);say(`取得編號 ${s.s}！`)}
function ctl(){M(`<span class="badge">SDG 7</span><h3>🔌 電源總控箱</h3><p>面板：「請依序輸入四個開關的數字：<b>右前電燈 → 左前電扇 → 左後電扇 → 前方大屏</b>」</p><input class="cd" id="cd" maxlength="4" inputmode="numeric" placeholder="????"><div id="dm" style="min-height:1.4em"></div><button class="main" onclick="tryCtl()">確認</button> <button class="main gr" onclick="closeM()">返回</button>`)}
function tryCtl(){if(document.getElementById("cd").value=="2807")pass(1,"<p>電燈亮起、電扇轉動、大屏開機——密碼 <b>2807</b> 正確，教室電力恢復！</p>");else document.getElementById("dm").textContent="❌ 密碼錯誤，檢查四個開關的順序與數字。"}
const NU=[["🍚🌽🥔","全穀雜糧類"],["🐟🥚🍗","豆魚蛋肉類"],["🥛🧀","乳品類"],["🥬🥕","蔬菜類"],["🍎🍌","水果類"],["🥜🫒","油脂與堅果種子類"]];
function nut(){const names=NU.map(a=>a[1]),opts=`<option value="">選擇</option>`+names.map(n=>`<option>${n}</option>`).join("");const rows=NU.map((a,i)=>[a[0],i]).sort(()=>Math.random()-.5);
M(`<span class="badge">SDG 2</span><h3>🥗 營養均衡公告</h3><p>公告被撕成碎片。請把食物配對到正確的「六大類營養來源」，拼回完整公告。</p>${rows.map(r=>`<div class="nr"><span style="font-size:1.5rem;min-width:80px">${r[0]}</span><select id="n${r[1]}">${opts}</select></div>`).join("")}<div id="nm" style="min-height:1.4em"></div><button class="main" onclick="tryNut()">拼合公告</button> <button class="main gr" onclick="closeM()">返回</button>`)}
function tryNut(){let ok=0;NU.forEach((a,i)=>{const s=document.getElementById("n"+i);const g=s.value==a[1];if(g)ok++;s.style.borderColor=g?"#2e7d4f":"#c0392b"});
if(ok==6)pass(2,`<p>六大類營養來源：${NU.map(a=>a[1]).join("、")}。</p>`);else document.getElementById("nm").textContent=`❌ 答對 ${ok}/6，紅框的再想想。`}
let jr=[];
function jar(){jr=[];M(`<span class="badge">SDG 1</span><h3>🏯 發票捐贈罐</h3><p>罐子外觀像客家圓樓，上面貼著春聯，下聯被撕掉一部分：</p><div class="cp">橫批：消除貧窮<br>上聯：隨手捐發票<br>下聯：救救<span id="js">＿＿＿</span></div><p style="font-size:.85rem">提示：請參考「愛心公告」，依序選出受助對象（老人、身心障礙、貧窮）。</p><div>${["窮","幼","老","病","殘","貧"].map(c=>`<button class="opt" onclick="jp('${c}')">${c}</button>`).join("")}</div><div id="jm" style="min-height:1.4em"></div><button class="main" onclick="tryJar()">確認</button> <button class="main gr" onclick="jr=[];jup()">清除</button> <button class="main gr" onclick="closeM()">返回</button>`)}
function jup(){document.getElementById("js").textContent=(jr.join("")+"＿＿＿").slice(0,3)}
function jp(c){if(jr.length<3){jr.push(c);jup()}}
function tryJar(){if(jr.join("")=="老殘窮")pass(3,`<div class="cp">橫批：消除貧窮<br>隨手捐發票，救救老殘窮</div>`);else document.getElementById("jm").textContent="❌ 還不對，再看看愛心公告的順序。"}
function door(){if(stage<3){say(`🚪 大門鎖住了。你已通過 ${stage}/3 關，需要依序通過：永續能源、消除飢餓、消除貧窮。`);return}
M(`<h3>🚪 807 密室大門</h3><p>請依 SDGs「通過關卡的編號歷程」輸入 3 位數逃脫密碼。</p><input class="cd" id="pw" maxlength="3" inputmode="numeric" placeholder="???"><div id="dm" style="min-height:1.4em"></div><button class="main" onclick="tryPw()">開鎖</button> <button class="main gr" onclick="closeM()">返回</button>`)}
function tryPw(){if(document.getElementById("pw").value=="721"){const s=Math.floor((performance.now()-t0)/1000);paused=true;
M(`<div style="text-align:center"><h2>🎓 成功逃出 807 密室！</h2><p>逃脫密碼：<b>7 → 2 → 1</b></p><p>用時 ${s} 秒，密碼輸入錯誤 ${tries} 次。</p><p>能源、飢餓、貧窮——從節電、均衡飲食到捐發票，永續就在日常行動中！</p><button class="main" onclick="start()">再玩一次</button></div>`)}
else{tries++;document.getElementById("dm").textContent="❌ 密碼錯誤，回想通過關卡的順序。"}}
function start(){p={x:240,y:285,f:0,w:0,m:false,tx:null,ty:null};on={};log=[];stage=0;tries=0;t0=performance.now();ui();say("🧑‍🎓 你被關在 807 教室裡了！先找出四個開關的數字。");closeM()}
function intro(){M(`<h2>🏫 SDGs 807 密室逃脫</h2><p>你是被鎖在 807 教室的學生。依序通過 <b>永續能源 → 消除飢餓 → 消除貧窮</b> 三關，再用關卡編號組成逃脫密碼！</p><p>用 ▲▼◀▶ 走動，或點教室地面讓角色走過去；靠近物品按「調查」。</p><button class="main" onclick="start()">開始</button>`)}
const bind=(id,k)=>{const e=document.getElementById(id);e.addEventListener("pointerdown",ev=>{ev.preventDefault();keys[k]=1});["pointerup","pointerleave","pointercancel"].forEach(n=>e.addEventListener(n,()=>keys[k]=0))};
[["u","u"],["d","d"],["l","l"],["r","r"]].forEach(a=>bind(...a));
document.getElementById("act").addEventListener("pointerdown",e=>{e.preventDefault();act()});
const km={w:"u",ArrowUp:"u",s:"d",ArrowDown:"d",a:"l",ArrowLeft:"l",d:"r",ArrowRight:"r"};
addEventListener("keydown",e=>{if(document.activeElement.tagName=="INPUT"||document.activeElement.tagName=="SELECT")return;if(km[e.key]){keys[km[e.key]]=1;e.preventDefault()}if(e.key=="e"||e.key==" ")act()});
addEventListener("keyup",e=>{if(km[e.key])keys[km[e.key]]=0});
cv.addEventListener("pointerdown",e=>{if(paused)return;const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*480,y=(e.clientY-r.top)/r.height*360;let t=null;for(const o of O)if(Math.hypot(x-o.x,y-o.y)<24)t=o;
if(t&&Math.hypot(p.x-t.x,p.y-t.y)<50){near=t;act();return}
if(t){const a=Math.atan2(p.y-t.y,p.x-t.x);p.tx=t.x+Math.cos(a)*34;p.ty=t.y+Math.sin(a)*34}else{p.tx=Math.max(34,Math.min(446,x));p.ty=Math.max(34,Math.min(326,y))}});
p={x:240,y:285,f:0,w:0,m:false,tx:null,ty:null};ui();say("🧑‍🎓 在 807 教室走動，靠近物品後按「調查」。");intro();loop();
</script></body></html>
